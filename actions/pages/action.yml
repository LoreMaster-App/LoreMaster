name: LoreMaster docs site
description: Build the GitHub Pages site of a repository's Markdown into a folder (to deploy beside another site) or publish it to a branch.
author: LoreMaster

branding:
  icon: book-open
  color: blue

inputs:
  mode:
    description: "build writes the site into `out` (no git, no network); publish pushes it to the output's branch."
    default: build
  out:
    description: "build mode: the folder to write the site into, relative to the working directory. Created, replaced when an earlier build wrote it, refused when it holds other files."
    default: lore-master-site
  workspace:
    description: The folder to document, relative to the working directory. Its .vscode/settings.json (loreMaster.* keys) is read unless the inputs below say it all.
    default: .
  settings:
    description: 'Settings that win over the folder''s, as JSON of loreMaster.* keys, e.g. {"loreMaster.ignore": ["internal/"]}. The inputs below are merged on top of it.'
    default: ""
  outputs:
    description: 'The loreMaster.outputs setting, as a JSON array. With it the action needs no settings file in the repository.'
    default: ""
  ignore:
    description: "The loreMaster.ignore setting: gitignore-style patterns to leave out, one per line."
    default: ""
  skip-gitignored:
    description: "The loreMaster.skipGitignored setting (true or false). Empty keeps the setting's value."
    default: ""
  generators:
    description: 'The loreMaster.generators setting, as a JSON array.'
    default: ""
  output:
    description: "Position of the github-pages output in the outputs list. Needed only when the settings have several."
    default: ""
  generate:
    description: "Run the generators of the loreMaster.generators setting (code documentation, test results) before building. Their own toolchains must be installed by earlier steps."
    default: "false"
  token:
    description: "publish mode: the token git uses to push. The job needs `permissions: contents: write`."
    default: ${{ github.token }}

outputs:
  path:
    description: "build mode: the absolute path of the folder the site was written into."
    value: ${{ steps.run.outputs.path }}
  files:
    description: The number of files in the site.
    value: ${{ steps.run.outputs.files }}

runs:
  using: composite
  steps:
    # The engine has no release binaries yet (#201), so it is built from this action's own
    # checkout. This step is replaced by a download once releases carry the binaries.
    - uses: actions/setup-go@v6
      with:
        go-version-file: ${{ github.action_path }}/../../go.mod
        cache-dependency-path: ${{ github.action_path }}/../../go.sum

    - name: Build the LoreMaster engine
      shell: bash
      working-directory: ${{ github.action_path }}/../..
      env:
        ACTION_REF: ${{ github.action_ref }}
      run: |
        exe=""
        if [ "$RUNNER_OS" = "Windows" ]; then exe=".exe"; fi
        go build -trimpath -ldflags "-X main.version=${ACTION_REF:-local}" \
          -o "$RUNNER_TEMP/lore-master-engine$exe" ./apps/lore-master-engine
        echo "LORE_MASTER_ENGINE=$RUNNER_TEMP/lore-master-engine$exe" >> "$GITHUB_ENV"

    - name: Let git push in publish mode
      if: inputs.mode == 'publish'
      shell: bash
      env:
        TOKEN: ${{ inputs.token }}
      run: |
        echo "::add-mask::$TOKEN"
        git config --global "url.https://x-access-token:${TOKEN}@github.com/.insteadOf" "https://github.com/"

    - id: run
      name: Generate the site
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
        OUT: ${{ inputs.out }}
        WORKSPACE: ${{ inputs.workspace }}
        OUTPUT: ${{ inputs.output }}
        GENERATE: ${{ inputs.generate }}
        SETTINGS: ${{ inputs.settings }}
        OUTPUTS: ${{ inputs.outputs }}
        IGNORE: ${{ inputs.ignore }}
        SKIP_GITIGNORED: ${{ inputs.skip-gitignored }}
        GENERATORS: ${{ inputs.generators }}
      run: |
        set -euo pipefail

        # The inputs are the most specific layer of the configuration (#313): the engine merges
        # them over the folder's settings, so a repository can configure the action entirely here.
        overrides="$SETTINGS"
        if [ -z "$overrides" ]; then overrides='{}'; fi
        if [ -n "$OUTPUTS$GENERATORS$SKIP_GITIGNORED$IGNORE" ]; then
          # jq ships on GitHub-hosted runners; a self-hosted runner needs it for these inputs.
          command -v jq > /dev/null || { echo "::error::the outputs, generators, skip-gitignored and ignore inputs need jq on the runner"; exit 1; }
          if [ -n "$OUTPUTS" ];         then overrides=$(jq -c --argjson v "$OUTPUTS" '. + {"loreMaster.outputs": $v}' <<< "$overrides"); fi
          if [ -n "$GENERATORS" ];      then overrides=$(jq -c --argjson v "$GENERATORS" '. + {"loreMaster.generators": $v}' <<< "$overrides"); fi
          if [ -n "$SKIP_GITIGNORED" ]; then overrides=$(jq -c --argjson v "$SKIP_GITIGNORED" '. + {"loreMaster.skipGitignored": $v}' <<< "$overrides"); fi
          if [ -n "$IGNORE" ];          then overrides=$(jq -c --arg v "$IGNORE" '. + {"loreMaster.ignore": ($v | split("\n") | map(select(length > 0)))}' <<< "$overrides"); fi
        fi
        export LORE_MASTER_SETTINGS="$overrides"

        case "$MODE" in
          build | publish) ;;
          *) echo "::error::mode must be build or publish, got '$MODE'"; exit 64 ;;
        esac

        select=()
        if [ -n "$OUTPUT" ]; then select=(--output "$OUTPUT"); fi

        if [ "$GENERATE" = "true" ]; then
          "$LORE_MASTER_ENGINE" generate --workspace "$WORKSPACE"
        fi

        report="$RUNNER_TEMP/lore-master-pages.json"
        code=0
        if [ "$MODE" = "build" ]; then
          "$LORE_MASTER_ENGINE" pages build --workspace "$WORKSPACE" --out "$OUT" ${select[@]+"${select[@]}"} --json > "$report" || code=$?
        else
          "$LORE_MASTER_ENGINE" pages publish --workspace "$WORKSPACE" ${select[@]+"${select[@]}"} --json > "$report" || code=$?
        fi

        cat "$report"
        if command -v jq > /dev/null && [ -s "$report" ]; then
          jq -r '.warnings[]? | "::warning::" + .' "$report"
          jq -r '.errors[]? | "::error::" + .' "$report"
        fi
        if [ "$code" -ne 0 ]; then exit "$code"; fi

        echo "files=$(grep -o '"files": *[0-9]*' "$report" | grep -o '[0-9]*$' | head -n 1)" >> "$GITHUB_OUTPUT"
        if [ "$MODE" = "build" ]; then
          echo "path=$(cd "$OUT" && pwd)" >> "$GITHUB_OUTPUT"
        fi

    - name: Forget the git credentials
      if: always() && inputs.mode == 'publish'
      shell: bash
      run: |
        git config --global --name-only --get-regexp 'x-access-token.*insteadof' | while read -r key; do
          git config --global --unset-all "$key"
        done || true
