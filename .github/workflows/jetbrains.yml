name: JetBrains plugin

# The JetBrains shell is a Gradle project that mnci does not build, so it has its own workflow. It builds the engine, then
# runs the plugin's tests against it (including a ping of the real engine).

on:
  push:
    branches: [main]
    paths: ['apps/lore-master-jetbrains/**', 'apps/lore-master-engine/**', '.github/workflows/jetbrains.yml']
  pull_request:
    branches: [main]
    paths: ['apps/lore-master-jetbrains/**', 'apps/lore-master-engine/**', '.github/workflows/jetbrains.yml']

permissions:
  contents: read

jobs:
  jetbrains:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - run: go build -o "$RUNNER_TEMP/lore-master-engine" ./apps/lore-master-engine
        name: Build the engine

      - run: ./gradlew test --console=plain
        name: Test the plugin
        working-directory: apps/lore-master-jetbrains
        env:
          LORE_MASTER_ENGINE: ${{ runner.temp }}/lore-master-engine

  # A merge to main that carries a new pluginVersion (apps/lore-master-jetbrains/gradle.properties) releases the plugin: one zip
  # with the engine for every platform, attached to a GitHub Release tagged lore-master-jetbrains@<version>. It goes to the
  # JetBrains Marketplace as well when the JETBRAINS_MARKETPLACE_TOKEN secret exists (the first upload of a plugin is made by hand).
  release:
    if: github.event_name == 'push'
    needs: jetbrains
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      JETBRAINS_MARKETPLACE_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - id: version
        run: |
          version=$(sed -n 's/^pluginVersion=//p' apps/lore-master-jetbrains/gradle.properties | tr -d '\r')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/lore-master-jetbrains@$version" >/dev/null; then
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi
        name: Read the plugin version

      - if: steps.version.outputs.released == 'false'
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - if: steps.version.outputs.released == 'false'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - if: steps.version.outputs.released == 'false'
        uses: gradle/actions/setup-gradle@v6

      - if: steps.version.outputs.released == 'false'
        name: Build the engine for every platform
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for target in windows/amd64 windows/arm64 linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${target%/*}; arch=${target#*/}
            name=lore-master-engine; [ "$os" = windows ] && name=lore-master-engine.exe
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=$VERSION"               -o "dist/platforms/lore-master-engine/$os-$arch/$name" ./apps/lore-master-engine
          done

      - if: steps.version.outputs.released == 'false'
        run: ./gradlew buildPlugin --console=plain
        name: Build the plugin
        working-directory: apps/lore-master-jetbrains

      - if: steps.version.outputs.released == 'false'
        name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "lore-master-jetbrains@$VERSION" "apps/lore-master-jetbrains/build/distributions/lore-master-jetbrains-$VERSION.zip"             --latest=false --target "$GITHUB_SHA" --title "LoreMaster for JetBrains $VERSION"             --notes "Install from disk: Settings > Plugins > the gear > Install Plugin from Disk, then pick the zip."

      - if: steps.version.outputs.released == 'false' && env.JETBRAINS_MARKETPLACE_TOKEN != ''
        run: ./gradlew publishPlugin --console=plain
        name: Publish to the JetBrains Marketplace
        # A rejection by the Marketplace (for one, while the first upload is in review) must not hide the GitHub Release.
        continue-on-error: true
        working-directory: apps/lore-master-jetbrains
